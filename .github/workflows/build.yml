name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pygame keyboard pyinstaller
      - run: pyinstaller --onefile --noconsole --add-data "assets;assets" --name DORS main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DORS-exe
          path: dist/DORS.exe
